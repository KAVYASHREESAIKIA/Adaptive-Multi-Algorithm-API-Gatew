version: '3.8'

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gateway_user -d gateway_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Redis (Shared State for Distributed Gateway)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gateway-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Backend Service (Protected)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gateway-backend
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - gateway-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Gateway Instance 1
  # ─────────────────────────────────────────
  gateway-1:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-instance-1
    environment:
      GATEWAY_PORT: 3000
      NODE_ENV: development
      INSTANCE_ID: gateway-1
      JWT_ACCESS_SECRET: adaptive-gateway-access-secret-key-2024
      JWT_REFRESH_SECRET: adaptive-gateway-refresh-secret-key-2024
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gateway_db
      DB_USER: gateway_user
      DB_PASSWORD: gateway_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:5000
      DEFAULT_ALGORITHM: token_bucket
      FREE_TIER_LIMIT: 100
      PREMIUM_TIER_LIMIT: 1000
      CB_FAILURE_THRESHOLD: 5
      CB_RESET_TIMEOUT: 60000
      CB_HALF_OPEN_REQUESTS: 1
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - gateway-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Gateway Instance 2 (Distributed Simulation)
  # ─────────────────────────────────────────
  gateway-2:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-instance-2
    environment:
      GATEWAY_PORT: 3000
      NODE_ENV: development
      INSTANCE_ID: gateway-2
      JWT_ACCESS_SECRET: adaptive-gateway-access-secret-key-2024
      JWT_REFRESH_SECRET: adaptive-gateway-refresh-secret-key-2024
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gateway_db
      DB_USER: gateway_user
      DB_PASSWORD: gateway_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:5000
      DEFAULT_ALGORITHM: token_bucket
      FREE_TIER_LIMIT: 100
      PREMIUM_TIER_LIMIT: 1000
      CB_FAILURE_THRESHOLD: 5
      CB_RESET_TIMEOUT: 60000
      CB_HALF_OPEN_REQUESTS: 1
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - gateway-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Frontend Dashboard
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gateway-dashboard
    ports:
      - "5173:80"
    depends_on:
      - gateway-1
      - gateway-2
    networks:
      - gateway-network
    restart: unless-stopped

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─────────────────────────────────────────
# Network
# ─────────────────────────────────────────
networks:
  gateway-network:
    driver: bridge
